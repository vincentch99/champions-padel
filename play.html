<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c0c">
  <title>Team Americano · Champions Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:    #f5c842;
      --bg:      #0c0c0c;
      --surface: rgba(255,255,255,0.05);
      --surface2:rgba(255,255,255,0.09);
      --border:  rgba(255,255,255,0.10);
      --text:    #efefef;
      --muted:   #6b7280;
      --green:   #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --safe-b:  env(safe-area-inset-bottom, 0px);
      --safe-t:  env(safe-area-inset-top, 0px);
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      min-height: 100svh; overscroll-behavior: none;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12,12,12,0.92); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      height: calc(52px + var(--safe-t));
      padding-top: var(--safe-t);
    }
    .topbar-logo { font-size: 12px; font-weight: 800; letter-spacing: 0.15em; color: var(--gold); }
    .topbar a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 8px 0 8px 8px; }

    /* ── App shell ── */
    .app { max-width: 600px; margin: 0 auto; padding: 20px 14px calc(36px + var(--safe-b)); }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .card-hi { background: var(--surface2); }

    /* ── Buttons — all have 48px min touch target ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 12px 22px; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; border: none; transition: background 0.12s, opacity 0.12s;
      white-space: nowrap; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn-gold    { background: var(--gold); color: #0c0c0c; }
    .btn-gold:active  { opacity: 0.82; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:active { background: rgba(255,255,255,0.06); }
    .btn-ghost   { background: transparent; border: none; color: var(--muted); min-height: 44px; }
    .btn-danger  { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .btn-sm      { min-height: 40px; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .btn-full    { width: 100%; }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    /* ── Inputs — 16px prevents iOS zoom ── */
    .inp {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 14px; font-family: inherit; font-size: 16px; color: var(--text);
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s;
    }
    .inp:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.09); }
    .inp::placeholder { color: var(--muted); }
    .inp-sm { padding: 10px 12px; font-size: 16px; border-radius: 8px; }

    /* ── Score inputs ── */
    .score-inp {
      width: 72px; text-align: center;
      background: rgba(255,255,255,0.08); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 6px;
      font-size: 28px; font-weight: 800; color: var(--text); font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .score-inp:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.12); }

    /* ── Toggle group ── */
    .tg { display: flex; gap: 8px; flex-wrap: wrap; }
    .tg-btn {
      min-height: 44px; padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.12s; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .tg-btn.on      { background: var(--gold); color: #0c0c0c; border-color: var(--gold); font-weight: 700; }
    .tg-btn.on-blue { background: var(--blue); color: #0c0c0c; border-color: var(--blue); font-weight: 700; }
    .tg-btn:active  { opacity: 0.75; }

    /* ── Typography ── */
    .h1  { font-size: clamp(24px,7vw,32px); font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    .h2  { font-size: 19px; font-weight: 700; }
    .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .dim { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ── Progress ── */
    .prog { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 10px 0 10px; }
    .prog-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s; }

    /* ── Info box ── */
    .info-box { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .info-cell { padding: 14px 10px; text-align: center; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .info-cell:nth-child(2n) { border-right: none; }
    .info-cell:nth-last-child(-n+2) { border-bottom: none; }
    .info-val { font-size: 26px; font-weight: 800; color: var(--gold); line-height: 1; }
    .info-key { font-size: 10px; color: var(--muted); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Standings table ── */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tbl { width: 100%; border-collapse: collapse; min-width: 280px; }
    .tbl th { padding: 10px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    .tbl td { padding: 13px 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr.gold-row td { background: rgba(245,200,66,0.07); }

    /* ── Court badge ── */
    .court-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Match card ── */
    .match-teams {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
    }
    .match-score-block {
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* ── Outcome buttons (tennis tap-to-score) ── */
    .outcome-btn {
      flex: 1; min-height: 56px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--text); font-family: inherit; font-size: 18px; font-weight: 800;
      cursor: pointer; transition: background 0.1s, border-color 0.1s, transform 0.08s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .outcome-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.12); }

    /* ── Editable score (done state) ── */
    .score-edit {
      cursor: pointer; border-bottom: 2px dashed rgba(255,255,255,0.25);
      padding-bottom: 2px; transition: opacity 0.15s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .score-edit:active { opacity: 0.5; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(28px + var(--safe-b)); left: 50%;
      transform: translateX(-50%);
      background: #242424; border: 1px solid rgba(255,255,255,0.15);
      padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 500; max-width: 90vw; text-align: center;
      z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── Animations ── */
    .screen { animation: up 0.16s ease; }
    @keyframes up { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* ── Round dots ── */
    .round-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .round-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">⚡ FIX MIX SUNDAYS</span>
  <a href="index.html" style="font-size:12px;color:var(--muted);text-decoration:none;">← Leaderboard</a>
</div>

<div id="app" class="app"></div>
<div class="toast" id="toast"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const COLORS       = ['#f5c842','#60a5fa','#f87171','#4ade80','#fb923c','#a78bfa','#34d399','#f472b6','#e879f9','#22d3ee','#fbbf24','#86efac'];
const COURT_COLORS = ['#f5c842','#60a5fa','#f87171','#4ade80'];
const KEY          = 'cc-team-americano';

// ── State ─────────────────────────────────────────────────────────────────────
let S = null;
function load()    { try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; } }
function persist() { localStorage.setItem(KEY, JSON.stringify(S)); }
function wipe()    { localStorage.removeItem(KEY); S = null; }

// ── Router ────────────────────────────────────────────────────────────────────
function go(screen) {
  const app = document.getElementById('app');
  app.className = 'app screen';
  app.innerHTML =
    screen === 'home'  ? homeHTML()  :
    screen === 'setup' ? setupHTML() :
    screen === 'play'  ? playHTML()  : finalHTML();
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function homeHTML() {
  const has = !!S;
  return `
    <div style="text-align:center;padding:44px 0 28px;">
      <div style="font-size:52px;margin-bottom:14px;">🎾</div>
      <div class="h1" style="margin-bottom:8px;">Team Americano</div>
      <div class="dim" style="max-width:300px;margin:0 auto;line-height:1.6;">
        Fixed pairs · Round-robin · Every team plays every other team · Highest total wins
      </div>
    </div>

    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
      ${['👫 Fixed pairs','🔄 Round-robin','🎾 Tennis or Points','📊 Live standings'].map(l =>
        `<span style="padding:5px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;color:var(--muted);">${l}</span>`
      ).join('')}
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-gold btn-full" style="padding:15px;font-size:15px;" onclick="newSession()">+ New Session</button>
      ${has ? `
        <button class="btn btn-outline btn-full" onclick="resume()">
          ▶ Resume · ${S.teams.length} teams · Round ${S.currentRound+1}/${S.schedule.length}
          · ${S.scoringMode === 'tennis' ? 'Bo'+S.setFormat : S.pointsPerMatch+'pts'}
        </button>
        <button class="btn btn-ghost btn-sm btn-full" style="color:var(--red);" onclick="confirmDiscard()">Discard session</button>
      ` : ''}
    </div>

    <div style="margin-top:36px;">
      <div class="lbl" style="margin-bottom:10px;">How it works</div>
      ${['Set up fixed pairs (male + female)','Choose Tennis or Points scoring','Every team plays every other team once','Highest total score wins the session'].map((s,i) => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-radius:8px;margin-bottom:6px;">
          <span style="width:22px;height:22px;border-radius:50%;background:var(--gold);color:#0c0c0c;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i+1}</span>
          <span style="font-size:13px;">${s}</span>
        </div>`).join('')}
    </div>`;
}

function newSession() {
  S = {
    scoringMode: 'tennis', setFormat: 3,
    pointsPerMatch: 32, courts: 2,
    teams: [
      { id:'t1', name:'Team 1', p1:'', p2:'', color: COLORS[0] },
      { id:'t2', name:'Team 2', p1:'', p2:'', color: COLORS[1] },
      { id:'t3', name:'Team 3', p1:'', p2:'', color: COLORS[2] },
      { id:'t4', name:'Team 4', p1:'', p2:'', color: COLORS[3] },
    ],
    schedule: [], currentRound: 0, status: 'setup',
  };
  go('setup');
}

function resume()         { go(S.status === 'finished' ? 'final' : 'play'); }
function confirmDiscard() { if (confirm('Discard the current session?')) { wipe(); go('home'); } }

// ── SETUP ─────────────────────────────────────────────────────────────────────
function setupHTML() {
  const { n, rounds, matchesPerRound, totalMatches } = scheduleInfo();
  const tennis = S.scoringMode === 'tennis';

  return `
    <div style="margin-bottom:20px;">
      <div class="h2">Setup Session</div>
      <div class="dim" style="margin-top:4px;">Configure teams, scoring format, and courts.</div>
    </div>

    <!-- Scoring mode -->
    <div class="card" style="margin-bottom:10px;">
      <div class="lbl" style="margin-bottom:10px;">Scoring format</div>
      <div class="tg" id="mode-tg">
        <button class="tg-btn ${tennis?'on-blue':''}" onclick="setMode('tennis')">🎾 Tennis</button>
        <button class="tg-btn ${!tennis?'on':''}" onclick="setMode('points')">📍 Points</button>
      </div>
      <div id="scoring-sub" style="margin-top:14px;">
        ${scoringSubHTML(tennis)}
      </div>
    </div>

    <!-- Courts -->
    <div class="card" style="margin-bottom:10px;">
      <div class="lbl" style="margin-bottom:10px;">Number of courts</div>
      <div class="tg" id="courts-tg">
        ${[1,2,3,4].map(c => `<button class="tg-btn ${S.courts===c?'on':''}" onclick="setCourts(${c})">${c} court${c>1?'s':''}</button>`).join('')}
      </div>
    </div>

    <!-- Teams -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div class="lbl">Teams <span id="tc" style="color:var(--gold);margin-left:4px;">${S.teams.length}</span></div>
      <button class="btn btn-outline btn-sm" onclick="addTeam()">+ Add Team</button>
    </div>
    <div id="teams-list">${S.teams.map(teamCardHTML).join('')}</div>

    <!-- Session summary -->
    <div style="margin:16px 0 8px;">
      <div class="lbl" style="margin-bottom:8px;">Session summary</div>
      <div class="info-box" id="info-box">${infoBoxHTML(n, rounds, matchesPerRound, totalMatches)}</div>
      <div class="dim" style="margin-top:8px;font-size:11px;" id="info-note">${infoNote(n, rounds, matchesPerRound)}</div>
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline" onclick="go('home')">← Back</button>
      <button class="btn btn-gold" style="flex:1;" onclick="startSession()">Generate Schedule →</button>
    </div>`;
}

function scoringSubHTML(tennis) {
  if (tennis) {
    return `
      <div class="lbl" style="margin-bottom:8px;">Match format</div>
      <div class="tg" id="sf-tg">
        <button class="tg-btn ${S.setFormat===3?'on-blue':''}" onclick="setFmt(3)">Best of 3</button>
        <button class="tg-btn ${S.setFormat===5?'on-blue':''}" onclick="setFmt(5)">Best of 5</button>
      </div>
      <div class="dim" style="margin-top:8px;font-size:12px;" id="fmt-hint">
        Play all ${S.setFormat} sets — tap the final score, e.g. ${Math.ceil(S.setFormat/2)}-${Math.floor(S.setFormat/2)} or ${S.setFormat}-0.
      </div>`;
  }
  return `
    <div class="lbl" style="margin-bottom:8px;">Points per match</div>
    <div class="tg" id="pts-tg">
      ${[16,24,32].map(p => `<button class="tg-btn ${S.pointsPerMatch===p?'on':''}" onclick="setPts(${p})">${p} pts</button>`).join('')}
    </div>
    <div class="dim" style="margin-top:8px;font-size:12px;">Both teams' scores must add up to this total.</div>`;
}

function infoBoxHTML(n, rounds, mpr, total) {
  const courts = Math.min(S.courts, mpr);
  return `
    <div class="info-cell"><div class="info-val">${n}</div><div class="info-key">Teams</div></div>
    <div class="info-cell"><div class="info-val">${rounds}</div><div class="info-key">Rounds</div></div>
    <div class="info-cell"><div class="info-val">${courts}</div><div class="info-key">Courts/Round</div></div>
    <div class="info-cell"><div class="info-val">${total}</div><div class="info-key">Total Matches</div></div>`;
}

function infoNote(n, rounds, mpr) {
  if (n < 4) return 'Add at least 4 teams to start.';
  const total = n * (n - 1) / 2;
  const lastRound = total % S.courts;
  const note = lastRound > 0
    ? `Last round has ${lastRound} match${lastRound>1?'es':''} (${S.courts-lastRound} court${S.courts-lastRound>1?'s':''} idle)`
    : 'All rounds use every court simultaneously';
  return `${n} teams · ${total} total matches · ${S.courts} per round · ${note}`;
}

function scheduleInfo() {
  const n = S.teams.length;
  const totalMatches = n * (n - 1) / 2;
  // Each round fits `courts` matches; last round may have fewer
  const rounds = Math.ceil(totalMatches / S.courts);
  return { n, rounds, matchesPerRound: S.courts, totalMatches };
}

function teamCardHTML(t) {
  return `
    <div class="card" id="tc-${t.id}" style="border-left:3px solid ${t.color};margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:12px;height:12px;border-radius:50%;background:${t.color};flex-shrink:0;"></div>
          <input class="inp inp-sm" style="width:120px;" value="${esc(t.name)}" placeholder="Team name"
            oninput="updTeam('${t.id}','name',this.value)">
        </div>
        ${S.teams.length > 2 ? `<button class="btn btn-danger btn-sm" onclick="removeTeam('${t.id}')">✕</button>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px;">👨 Player 1</div>
          <input class="inp inp-sm" value="${esc(t.p1)}" placeholder="Name" oninput="updTeam('${t.id}','p1',this.value)">
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px;">👩 Player 2</div>
          <input class="inp inp-sm" value="${esc(t.p2)}" placeholder="Name" oninput="updTeam('${t.id}','p2',this.value)">
        </div>
      </div>
    </div>`;
}

// Setup actions
function setMode(m) {
  S.scoringMode = m;
  document.querySelectorAll('#mode-tg .tg-btn').forEach(b => {
    const isTennis = b.textContent.includes('Tennis');
    b.className = 'tg-btn' + (isTennis && m==='tennis' ? ' on-blue' : !isTennis && m==='points' ? ' on' : '');
  });
  document.getElementById('scoring-sub').innerHTML = scoringSubHTML(m === 'tennis');
  refreshInfo();
}

function setFmt(f) {
  S.setFormat = f;
  document.querySelectorAll('#sf-tg .tg-btn').forEach(b =>
    b.className = 'tg-btn' + (b.textContent.includes(f) ? ' on-blue' : ''));
  const hint = document.getElementById('fmt-hint');
  if (hint) hint.textContent = `Play all ${f} sets — tap the final score, e.g. ${Math.ceil(f/2)}-${Math.floor(f/2)} or ${f}-0.`;
}

function setPts(p) {
  S.pointsPerMatch = p;
  document.querySelectorAll('#pts-tg .tg-btn').forEach(b =>
    b.classList.toggle('on', b.textContent.trim() === p+' pts'));
}

function setCourts(c) {
  S.courts = c;
  document.querySelectorAll('#courts-tg .tg-btn').forEach(b =>
    b.classList.toggle('on', b.textContent.trim().startsWith(c+' ')));
  refreshInfo();
}

function updTeam(id, key, val) {
  const t = S.teams.find(t => t.id === id);
  if (t) t[key] = val;
}

function addTeam() {
  if (S.teams.length >= 12) { toast('Maximum 12 teams'); return; }
  const idx = S.teams.length;
  const id  = 't' + Date.now();
  S.teams.push({ id, name:'Team '+(idx+1), p1:'', p2:'', color: COLORS[idx % COLORS.length] });
  const li = document.getElementById('teams-list');
  const d  = document.createElement('div');
  d.innerHTML = teamCardHTML(S.teams[S.teams.length-1]);
  li.appendChild(d.firstElementChild);
  document.getElementById('tc').textContent = S.teams.length;
  refreshInfo();
}

function removeTeam(id) {
  if (S.teams.length <= 2) { toast('Minimum 2 teams'); return; }
  S.teams = S.teams.filter(t => t.id !== id);
  document.getElementById('tc-'+id)?.remove();
  document.getElementById('tc').textContent = S.teams.length;
  refreshInfo();
}

function refreshInfo() {
  const { n, rounds, matchesPerRound, totalMatches } = scheduleInfo();
  const ib = document.getElementById('info-box');
  const note = document.getElementById('info-note');
  if (ib)   ib.innerHTML   = infoBoxHTML(n, rounds, matchesPerRound, totalMatches);
  if (note) note.textContent = infoNote(n, rounds, matchesPerRound);
}

function startSession() {
  if (S.teams.length < 4) { toast('Need at least 4 teams'); return; }
  try {
    S.schedule = buildSchedule();
  } catch(e) {
    toast('Error building schedule: ' + e.message); console.error(e); return;
  }
  if (!S.schedule || S.schedule.length === 0) { toast('Schedule is empty — check team count'); return; }
  S.currentRound = 0; S.status = 'playing';
  persist(); go('play');
}

// ── Schedule generation ────────────────────────────────────────────────────────
// Uses circle algorithm to generate balanced pairs, then repacks into rounds
// of exactly `courts` simultaneous matches so every round fills all courts.
function buildSchedule() {
  const ids = S.teams.map(t => t.id);
  const eff  = ids.length % 2 === 0 ? ids.length : ids.length + 1;
  const padded = ids.length % 2 !== 0 ? [...ids, 'bye'] : [...ids];
  const fix  = padded[0];
  let rot    = padded.slice(1);

  // Step 1: generate all pairs in round-robin order (7 rounds × 4 pairs for 8 teams)
  const allPairs = [];
  for (let r = 0; r < eff - 1; r++) {
    const list = [fix, ...rot];
    for (let i = 0; i < eff / 2; i++) {
      const a = list[i], b = list[eff - 1 - i];
      if (a !== 'bye' && b !== 'bye') allPairs.push([a, b]);
    }
    rot = [rot[rot.length - 1], ...rot.slice(0, -1)];
  }

  // Step 2: greedily pack pairs into rounds of `courts` with no team appearing twice
  const remaining = [...allPairs];
  const rounds    = [];
  let mid         = 0;

  while (remaining.length > 0) {
    const round      = [];
    const teamsUsed  = new Set();
    const toRemove   = [];

    for (let i = 0; i < remaining.length && round.length < S.courts; i++) {
      const [a, b] = remaining[i];
      if (!teamsUsed.has(a) && !teamsUsed.has(b)) {
        round.push({
          id: `m${mid++}`, court: round.length + 1,
          teamA: a, teamB: b,
          scoreA: null, scoreB: null, setsA: null, setsB: null, done: false,
        });
        teamsUsed.add(a); teamsUsed.add(b);
        toRemove.push(i);
      }
    }

    for (let i = toRemove.length - 1; i >= 0; i--) remaining.splice(toRemove[i], 1);
    rounds.push(round);
  }

  return rounds;
}

          </div>
        </div>
        <div style="text-align:right;">
          <div class="lbl">Format</div>
          <div style="font-size:13px;font-weight:700;color:${tennis?'var(--blue)':'var(--gold)'};">
            ${tennis ? `Bo${S.setFormat}` : `${S.pointsPerMatch} pts`}
          </div>
        </div>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${prog}%"></div></div>
      <!-- Round selector dots — tap to jump -->
      <div class="round-dots">
        ${S.schedule.map((r,i) => {
          const d = r.every(m => m.done);
          const c = i === S.currentRound;
          return `<div class="round-dot" onclick="jumpRound(${i})"
            style="background:${c?'var(--gold)':d?'var(--green)':'var(--border)'};
                   width:${c?'22px':'9px'};border-radius:5px;cursor:pointer;
                   transition:width 0.2s,background 0.2s;"></div>`;
        }).join('')}
      </div>
    </div>

    <!-- Round tabs (scroll row) -->
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
                -webkit-overflow-scrolling:touch;scrollbar-width:none;" id="round-tabs">
      ${S.schedule.map((r,i) => {
        const d   = r.every(m => m.done);
        const cur = i === S.currentRound;
        const partial = r.some(m=>m.done) && !d;
        return `<button onclick="jumpRound(${i})"
          style="flex-shrink:0;min-height:36px;padding:6px 14px;border-radius:20px;
                 font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
                 touch-action:manipulation;-webkit-tap-highlight-color:transparent;
                 border:1px solid ${cur?'var(--gold)':d?'var(--green)':partial?'rgba(96,165,250,0.4)':'var(--border)'};
                 background:${cur?'var(--gold)':d?'rgba(74,222,128,0.1)':partial?'rgba(96,165,250,0.08)':'transparent'};
                 color:${cur?'#0c0c0c':d?'var(--green)':'var(--text)'};">
          R${i+1}${d?' ✓':''}
        </button>`;
      }).join('')}
    </div>

    <!-- Current round matches -->
    <div class="lbl" style="margin-bottom:10px;">
      Round ${S.currentRound+1}
      <span style="color:var(--text);"> · ${round.filter(m=>m.done).length}/${round.length} done</span>
    </div>
    <div id="matches">${round.map(m => matchCardHTML(m)).join('')}</div>

    <!-- Finish button -->
    <div style="margin-top:16px;">
      ${allDone
        ? `<button class="btn btn-gold btn-full" style="font-size:16px;" onclick="finish()">🏆 See Final Results</button>`
        : `<div style="text-align:center;padding:12px;color:var(--muted);font-size:13px;">
             ${totalMatches - totalDone} match${totalMatches-totalDone!==1?'es':''} remaining

    <!-- Live standings -->

            <th>#</th><th>Team</th>
            ${tennis ? '<th>MW</th><th>SW</th><th>SL</th>'
                     : '<th>Pts</th><th>W</th><th>L</th>'}
          </tr></thead>
          <tbody>
            ${st.map((s,i) => {
              const t = team(s.id);
              const leading = tennis ? s.mw > 0 : s.pts > 0;
              return `<tr class="${i===0 && leading ? 'gold-row' : ''}">

// ── Match cards ────────────────────────────────────────────────────────────────
function matchCardHTML(m) {
  return S.scoringMode === 'tennis' ? tennisCardHTML(m) : pointsCardHTML(m);
}

function courtBadge(m) {
  const cc = COURT_COLORS[(m.court - 1) % COURT_COLORS.length];
  return `<span class="court-tag" style="background:${cc}22;color:${cc};">Court ${m.court}</span>`;
}

function teamBlock(t, align) {
  const right = align === 'right';
  return `
    <div style="text-align:${align};min-width:0;">
      <div style="display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;${right?'justify-content:flex-end;':''}overflow:hidden;">
        ${right
          ? `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.name}</span>
             <div style="width:9px;height:9px;border-radius:50%;background:${t.color};flex-shrink:0;"></div>`
          : `<div style="width:9px;height:9px;border-radius:50%;background:${t.color};flex-shrink:0;"></div>
             <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.name}</span>`}

}

// Points card
function pointsCardHTML(m) {
  const tA = team(m.teamA), tB = team(m.teamB);

  if (m.done) {
    const winA = m.scoreA > m.scoreB;
    return `
      <div class="card" style="margin-bottom:10px;opacity:0.75;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          ${courtBadge(m)}
          <span style="font-size:11px;color:var(--green);font-weight:700;">✓ Done</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted);">tap score to edit</span>
        </div>
        <div class="match-teams">
          ${teamBlock(tA,'left')}
          <div class="match-score-block">
            <div class="score-edit" onclick="editMatch('${m.id}')"
              style="font-size:32px;font-weight:800;color:${winA?tA.color:'var(--text)'};">${m.scoreA}</div>
            <div style="color:var(--muted);font-size:16px;margin:0 2px;">–</div>
            <div class="score-edit" onclick="editMatch('${m.id}')"
              style="font-size:32px;font-weight:800;color:${!winA?tB.color:'var(--text)'};">${m.scoreB}</div>
          </div>
          ${teamBlock(tB,'right')}
        </div>
      </div>`;
  }

  return `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        ${courtBadge(m)}
        <span class="dim" style="font-size:11px;">Play to ${S.pointsPerMatch} pts</span>
      </div>
      <div class="match-teams" style="margin-bottom:16px;">
        ${teamBlock(tA,'left')}
        <div class="match-score-block">
          <input type="number" inputmode="numeric" class="score-inp" id="sA-${m.id}"
            min="0" max="${S.pointsPerMatch}" placeholder="0"
            oninput="autoFill('${m.id}','A',this.value)">
          <span style="color:var(--muted);font-size:18px;margin:0 2px;">:</span>
          <input type="number" inputmode="numeric" class="score-inp" id="sB-${m.id}"
            min="0" max="${S.pointsPerMatch}" placeholder="0"
            oninput="autoFill('${m.id}','B',this.value)">
        </div>
        ${teamBlock(tB,'right')}
      </div>
      <button class="btn btn-gold btn-full" onclick="submitPoints('${m.id}')">Submit Score</button>
    </div>`;
}

function autoFill(id, side, val) {
  const n = parseInt(val);
  if (isNaN(n)) return;
  const el = document.getElementById(side === 'A' ? `sB-${id}` : `sA-${id}`);
  if (el && el.value === '') el.value = Math.max(0, S.pointsPerMatch - n);
}

function submitPoints(id) {
  const sA = parseInt(document.getElementById('sA-'+id)?.value);
  const sB = parseInt(document.getElementById('sB-'+id)?.value);
  if (isNaN(sA)||isNaN(sB))       { toast('Enter both scores'); return; }
  if (sA<0||sB<0)                 { toast('Scores must be 0 or above'); return; }
  if (sA+sB !== S.pointsPerMatch) { toast(`Scores must add up to ${S.pointsPerMatch}`); return; }
  const m = findMatch(id); if (!m) return;
  m.scoreA = sA; m.scoreB = sB; m.done = true;
  persist(); go('play');
}

// Tennis card — tap the final outcome button
function tennisCardHTML(m) {
  const tA    = team(m.teamA), tB = team(m.teamB);
  const toWin = Math.ceil(S.setFormat / 2);

  if (m.done) {
    const winA = m.setsA > m.setsB;
    return `
      <div class="card" style="margin-bottom:10px;opacity:0.75;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
          ${courtBadge(m)}
          <span style="font-size:11px;color:var(--green);font-weight:700;">✓ Done</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted);">tap score to edit</span>
        </div>
        <div class="match-teams">
          ${teamBlock(tA,'left')}
          <div onclick="editMatch('${m.id}')" class="score-edit"
            style="font-size:30px;font-weight:800;text-align:center;padding:4px 8px;">
            <span style="color:${winA?tA.color:'var(--text)'};">${m.setsA}</span>
            <span style="color:var(--muted);font-size:18px;margin:0 3px;">–</span>
            <span style="color:${!winA?tB.color:'var(--text)'};">${m.setsB}</span>
          </div>
          ${teamBlock(tB,'right')}
        </div>
      </div>`;
  }

  // All sets always played — scores sum to setFormat
  const outcomes = [];
  for (let w = toWin; w <= S.setFormat; w++) outcomes.push({ w, l: S.setFormat - w });

  const outcomeBtn = (sA, sB, label) =>
    `<button class="outcome-btn" onclick="selectOutcome('${m.id}',${sA},${sB})">${label}</button>`;

  return `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        ${courtBadge(m)}
        <span class="dim" style="font-size:11px;">All ${S.setFormat} sets · most wins</span>
      </div>

      <div class="match-teams" style="margin-bottom:18px;">
        ${teamBlock(tA,'left')}
        <span style="color:var(--muted);font-size:12px;">vs</span>
        ${teamBlock(tB,'right')}
      </div>

      <!-- Team A wins -->
      <div style="margin-bottom:12px;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
                    color:${tA.color};margin-bottom:8px;">${tA.name} wins</div>
        <div style="display:flex;gap:8px;">
          ${outcomes.map(o => outcomeBtn(o.w, o.l, `${o.w}–${o.l}`)).join('')}
        </div>
      </div>

      <!-- Team B wins -->
      <div>
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;
                    color:${tB.color};margin-bottom:8px;">${tB.name} wins</div>
        <div style="display:flex;gap:8px;">
          ${outcomes.map(o => outcomeBtn(o.l, o.w, `${o.w}–${o.l}`)).join('')}
        </div>
      </div>
    </div>`;
}

function selectOutcome(id, setsA, setsB) {
  const m = findMatch(id); if (!m) return;
  m.setsA = setsA; m.setsB = setsB; m.done = true;
  persist(); go('play');
}

function editMatch(id) {
  const m = findMatch(id); if (!m) return;
  m.scoreA = null; m.scoreB = null; m.setsA = null; m.setsB = null; m.done = false;
  persist(); go('play');
}

function jumpRound(i) {
  S.currentRound = i; persist(); go('play');
  // scroll tab into view after render
  setTimeout(() => {
    const tabs = document.getElementById('round-tabs');
    if (tabs) { const btn = tabs.children[i]; if (btn) btn.scrollIntoView({ inline:'center', behavior:'smooth' }); }
  }, 50);
}

function finish() {
  S.status = 'finished'; persist(); go('final');
}

function confirmNew() {

// ── Helpers ────────────────────────────────────────────────────────────────────
function team(id)    { return S.teams.find(t => t.id === id) || { name:'?', p1:'', p2:'', color:'#888' }; }
function pname(t)    { return (t.p1||'Player 1') + ' & ' + (t.p2||'Player 2'); }
function esc(s)      { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function findMatch(id) {
  for (const r of S.schedule) { const m = r.find(m => m.id === id); if (m) return m; }
  return null;
}

function standings() {
  return S.scoringMode === 'tennis' ? tennisStandings() : pointsStandings();
}

function pointsStandings() {
  const map = {};
  S.teams.forEach(t => { map[t.id] = { id:t.id, pts:0, ag:0, w:0, l:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    map[m.teamA].pts += m.scoreA; map[m.teamA].ag += m.scoreB;
    map[m.teamB].pts += m.scoreB; map[m.teamB].ag += m.scoreA;
    if (m.scoreA > m.scoreB) { map[m.teamA].w++; map[m.teamB].l++; }
    else                     { map[m.teamB].w++; map[m.teamA].l++; }
  }));
  return Object.values(map).sort((a,b) => b.pts-a.pts || b.w-a.w || (b.pts-b.ag)-(a.pts-a.ag));
}

function tennisStandings() {
  const map = {};
  S.teams.forEach(t => { map[t.id] = { id:t.id, mw:0, ml:0, sw:0, sl:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    const sA = m.setsA, sB = m.setsB;
    map[m.teamA].sw += sA; map[m.teamA].sl += sB;
    map[m.teamB].sw += sB; map[m.teamB].sl += sA;
    if (sA > sB) { map[m.teamA].mw++; map[m.teamB].ml++; }
    else         { map[m.teamB].mw++; map[m.teamA].ml++; }
  }));
  return Object.values(map).sort((a,b) => b.mw-a.mw || b.sw-a.sw || (b.sw-b.sl)-(a.sw-a.sl));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
go('home');
</script>
