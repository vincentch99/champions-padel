<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c0c0c">
  <title>Champions Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:    #f5c842;
      --bg:      #0c0c0c;
      --surface: rgba(255,255,255,0.05);
      --surface2:rgba(255,255,255,0.09);
      --border:  rgba(255,255,255,0.10);
      --text:    #efefef;
      --muted:   #6b7280;
      --green:   #4ade80;
      --red:     #f87171;
      --blue:    #60a5fa;
      --safe-b:  env(safe-area-inset-bottom, 0px);
      --safe-t:  env(safe-area-inset-top, 0px);
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 15px;
      min-height: 100svh; overscroll-behavior: none;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(12,12,12,0.92); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px;
      height: calc(52px + var(--safe-t));
      padding-top: var(--safe-t);
    }
    .topbar-logo { font-size: 12px; font-weight: 800; letter-spacing: 0.15em; color: var(--gold); }
    .topbar a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 8px 0 8px 8px; }

    /* ── App shell ── */
    .app { max-width: 600px; margin: 0 auto; padding: 20px 14px calc(36px + var(--safe-b)); }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .card-hi { background: var(--surface2); }

    /* ── Buttons — all have 48px min touch target ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 48px; padding: 12px 22px; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      cursor: pointer; border: none; transition: background 0.12s, opacity 0.12s;
      white-space: nowrap; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .btn-gold    { background: var(--gold); color: #0c0c0c; }
    .btn-gold:active  { opacity: 0.82; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:active { background: rgba(255,255,255,0.06); }
    .btn-ghost   { background: transparent; border: none; color: var(--muted); min-height: 44px; }
    .btn-danger  { background: rgba(248,113,113,0.12); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
    .btn-sm      { min-height: 40px; padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .btn-full    { width: 100%; }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    /* ── Inputs — 16px prevents iOS zoom ── */
    .inp {
      width: 100%; background: rgba(255,255,255,0.07);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 13px 14px; font-family: inherit; font-size: 16px; color: var(--text);
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s;
    }
    .inp:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.09); }
    .inp::placeholder { color: var(--muted); }
    .inp-sm { padding: 10px 12px; font-size: 16px; border-radius: 8px; }

    /* ── Score inputs ── */
    .score-inp {
      width: 72px; text-align: center;
      background: rgba(255,255,255,0.08); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 6px;
      font-size: 28px; font-weight: 800; color: var(--text); font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .score-inp:focus { outline: none; border-color: var(--gold); background: rgba(255,255,255,0.12); }

    /* ── Toggle group ── */
    .tg { display: flex; gap: 8px; flex-wrap: wrap; }
    .tg-btn {
      min-height: 44px; padding: 10px 18px; border-radius: 10px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.12s; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .tg-btn.on       { background: var(--gold);  color: #0c0c0c; border-color: var(--gold);  font-weight: 700; }
    .tg-btn.on-blue  { background: var(--blue);  color: #0c0c0c; border-color: var(--blue);  font-weight: 700; }
    .tg-btn.on-green { background: var(--green); color: #0c0c0c; border-color: var(--green); font-weight: 700; }
    .tg-btn:active  { opacity: 0.75; }

    /* ── Typography ── */
    .h1  { font-size: clamp(24px,7vw,32px); font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    .h2  { font-size: 19px; font-weight: 700; }
    .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    .dim { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* ── Progress ── */
    .prog { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 10px 0 10px; }
    .prog-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s; }

    /* ── Info box ── */
    .info-box { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .info-cell { padding: 14px 10px; text-align: center; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .info-cell:nth-child(2n) { border-right: none; }
    .info-cell:nth-last-child(-n+2) { border-bottom: none; }
    .info-val { font-size: 26px; font-weight: 800; color: var(--gold); line-height: 1; }
    .info-key { font-size: 10px; color: var(--muted); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Standings table ── */
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tbl { width: 100%; border-collapse: collapse; min-width: 280px; }
    .tbl th { padding: 10px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    .tbl td { padding: 13px 10px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr.gold-row td { background: rgba(245,200,66,0.07); }

    /* ── Court badge ── */
    .court-tag { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }

    /* ── Match card ── */
    .match-teams {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
    }
    .match-score-block {
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* ── Outcome buttons (tennis tap-to-score) ── */
    .outcome-btn {
      flex: 1; min-height: 56px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(255,255,255,0.04);
      color: var(--text); font-family: inherit; font-size: 18px; font-weight: 800;
      cursor: pointer; transition: background 0.1s, border-color 0.1s, transform 0.08s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .outcome-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.12); }

    /* ── Editable score (done state) ── */
    .score-edit {
      cursor: pointer; border-bottom: 2px dashed rgba(255,255,255,0.25);
      padding-bottom: 2px; transition: opacity 0.15s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .score-edit:active { opacity: 0.5; }

    /* ── Live score adj buttons ── */
    .adj-btn {
      width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid var(--border); background: rgba(255,255,255,0.06);
      color: var(--text); font-family: inherit; font-size: 20px; font-weight: 700;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.08s, transform 0.08s; flex-shrink: 0;
    }
    .adj-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.18); }
    .live-num {
      font-size: 56px; font-weight: 900; min-width: 60px; text-align: center;
      line-height: 1; font-variant-numeric: tabular-nums; transition: color 0.15s;
    }
    .live-score-col {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .live-team-name {
      font-weight: 700; font-size: 14px; text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 100%;
    }
    .live-team-sub {
      font-size: 11px; color: var(--muted); text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 100%;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(28px + var(--safe-b)); left: 50%;
      transform: translateX(-50%);
      background: #242424; border: 1px solid rgba(255,255,255,0.15);
      padding: 12px 22px; border-radius: 10px;
      font-size: 14px; font-weight: 500; max-width: 90vw; text-align: center;
      z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── Animations ── */
    .screen { animation: up 0.16s ease; }
    @keyframes up { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* ── Round dots ── */
    .round-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .round-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo">⚡ CHAMPIONS</span>
  <a href="index.html"
    style="font-size:12px;font-weight:700;color:var(--text);text-decoration:none;
           background:rgba(255,255,255,0.08);border:1px solid var(--border);
           border-radius:8px;padding:7px 12px;touch-action:manipulation;">
    ← Leaderboard
  </a>
</div>

<div id="app" class="app"></div>
<div class="toast" id="toast"></div>

<!-- Share Results Modal -->
<div id="share-modal" style="display:none;position:fixed;inset:0;z-index:1000;
     background:rgba(0,0,0,0.88);align-items:center;justify-content:center;
     padding:16px;box-sizing:border-box;flex-direction:column;gap:12px;">
  <canvas id="share-canvas" style="max-width:100%;border-radius:12px;display:block;box-shadow:0 8px 40px rgba(0,0,0,0.6);"></canvas>
  <div style="display:flex;gap:8px;width:100%;max-width:520px;">
    <button onclick="doShare()"
      style="flex:1;padding:14px;background:var(--gold);color:#0c0c0c;border:none;
             border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;">
      ⬆ Share / Download
    </button>
    <button onclick="copyShareText()"
      style="padding:14px 16px;background:rgba(255,255,255,0.08);color:var(--text);
             border:1px solid var(--border);border-radius:10px;font-weight:600;
             font-size:14px;cursor:pointer;font-family:inherit;">
      Copy Text
    </button>
    <button onclick="closeShareModal()"
      style="padding:14px 16px;background:transparent;color:var(--muted);
             border:1px solid var(--border);border-radius:10px;font-size:16px;
             cursor:pointer;font-family:inherit;">
      ✕
    </button>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const COLORS       = ['#f5c842','#60a5fa','#f87171','#4ade80','#fb923c','#a78bfa','#34d399','#f472b6','#e879f9','#22d3ee','#fbbf24','#86efac'];
const COURT_COLORS = ['#f5c842','#60a5fa','#f87171','#4ade80'];
const KEY          = 'cc-team-americano';

// ── Sheets integration — paste your Apps Script deployment URL here ───────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0ScCdvNn1NQYOqjuCp-ynpo3u9f97-tpD9D0T3xOnRYkOjuQbmQoOZM6892vt4zU7/exec';

// ── State ─────────────────────────────────────────────────────────────────────
let S = null;
function load() {
  try {
    S = JSON.parse(localStorage.getItem(KEY));
    if (S && !S.gameMode) S.gameMode = 'americano'; // backward compat
  } catch(e) { S = null; }
}
function persist() { localStorage.setItem(KEY, JSON.stringify(S)); }
function wipe()    { localStorage.removeItem(KEY); S = null; }

// ── Router ────────────────────────────────────────────────────────────────────
function go(screen) {
  const app = document.getElementById('app');
  app.className = 'app screen';
  app.innerHTML =
    screen === 'home'    ? homeHTML()    :
    screen === 'setup'   ? setupHTML()   :
    screen === 'play'    ? playHTML()    :
    screen === 'history' ? historyHTML() : finalHTML();
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function homeHTML() {
  const has = !!S;
  const modeCard = (icon, title, badge, badgeColor, desc, mode) => `
    <button onclick="newSession('${mode}')"
      style="display:block;width:100%;text-align:left;padding:18px 20px;
             background:var(--surface);border:1px solid var(--border);border-radius:14px;
             cursor:pointer;font-family:inherit;color:var(--text);
             touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background 0.12s;"
      onmouseover="this.style.background='var(--surface2)'"
      onmouseout="this.style.background='var(--surface)'"
      ontouchstart="this.style.background='var(--surface2)'"
      ontouchend="this.style.background='var(--surface)'">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
        <span style="font-size:32px;line-height:1;">${icon}</span>
        <div style="flex:1;">
          <div style="font-size:17px;font-weight:800;">${title}</div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:${badgeColor};margin-top:2px;">${badge}</div>
        </div>
        <span style="color:var(--muted);font-size:20px;">→</span>
      </div>
      <div style="font-size:13px;color:var(--muted);line-height:1.55;">${desc}</div>
    </button>`;

  return `
    <div style="text-align:center;padding:32px 0 24px;">
      <div style="font-size:42px;margin-bottom:10px;">🎾</div>
      <div class="h1" style="margin-bottom:6px;">Choose Game Mode</div>
      <div class="dim">CHAMPIONS · Padel Match Tracker</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
      ${modeCard('👫','Team Americano','Fixed pairs · Round-robin','var(--gold)',
        'Set fixed male + female pairs. Every team plays every other team once. Highest total score wins.','americano')}
      ${modeCard('🏅','Team Mexicano','Fixed pairs · Dynamic ranking','var(--green)',
        'Fixed pairs re-matched every round by standings. Top teams face top teams. Play as many rounds as you want.','team-mexicano')}
      ${modeCard('🔥','Mexicano','Individual · Dynamic ranking','var(--blue)',
        'Players re-pair every round based on current standings. Top players face top players — everyone competes at their level.','mexicano')}
    </div>

    ${has ? `
      <div style="border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:8px;">
        <div class="lbl">Saved session · ${S.gameMode==='mexicano'?'🔥 Mexicano':S.gameMode==='team-mexicano'?'🏅 Team Mexicano':'👫 Americano'}</div>
        <button class="btn btn-outline btn-full" onclick="resume()">
          ▶ Resume · ${S.gameMode==='mexicano' ? (S.players||[]).length+' players' : (S.teams||[]).length+' teams'}
          · Round ${S.currentRound+1}/${S.schedule.length||'?'}
          · ${S.scoringMode==='tennis' ? 'Bo'+S.setFormat : S.pointsPerMatch+'pts'}
        </button>
        <button class="btn btn-ghost btn-sm btn-full" style="color:var(--red);" onclick="confirmDiscard()">Discard session</button>
      </div>
    ` : `
      <div style="margin-top:8px;">
        <div class="lbl" style="margin-bottom:10px;">How it works</div>
        ${[
          ['👫','Team Americano','Create fixed pairs → auto round-robin schedule → enter scores each round.'],
          ['🔥','Mexicano','Add players → first round random pairs → re-ranked pairs every round after.'],
          ['📊','Live Standings','Standings update as you enter scores. Jump to any round freely.'],
        ].map(([ic,ttl,dsc]) => `
          <div style="display:flex;gap:12px;padding:12px 14px;background:var(--surface);border-radius:10px;margin-bottom:6px;">
            <span style="font-size:20px;flex-shrink:0;">${ic}</span>
            <div>
              <div style="font-size:13px;font-weight:700;margin-bottom:2px;">${ttl}</div>
              <div style="font-size:12px;color:var(--muted);">${dsc}</div>
            </div>
          </div>`).join('')}
      </div>
    `}

    <!-- History link -->
    <div style="margin-top:16px;text-align:center;">
      <button onclick="loadHistory()"
        style="background:none;border:none;color:var(--muted);font-size:13px;
               font-family:inherit;cursor:pointer;touch-action:manipulation;
               text-decoration:underline;text-underline-offset:3px;">
        📋 View past sessions
      </button>
    </div>`;
}

function newSession(mode) {
  if (mode === 'team-mexicano') {
    S = {
      gameMode: 'team-mexicano',
      scoringMode: 'points', pointsPerMatch: 21,
      courts: 2,
      teams: [
        { id:'t1', name:'Team 1', p1:'', p2:'', color: COLORS[0], byeCount:0 },
        { id:'t2', name:'Team 2', p1:'', p2:'', color: COLORS[1], byeCount:0 },
        { id:'t3', name:'Team 3', p1:'', p2:'', color: COLORS[2], byeCount:0 },
        { id:'t4', name:'Team 4', p1:'', p2:'', color: COLORS[3], byeCount:0 },
      ],
      schedule: [], currentRound: 0, status: 'setup',
    };
    go('setup'); return;
  }
  if (mode === 'mexicano') {
    S = {
      gameMode: 'mexicano',
      scoringMode: 'points', pointsPerMatch: 21,
      courts: 2, numRounds: 6,
      players: Array.from({length:4}, (_,i) => ({
        id:'p'+(i+1), name:'Player '+(i+1), color: COLORS[i % COLORS.length]
      })),
      schedule: [], currentRound: 0, status: 'setup',
    };
  } else {
    S = {
      gameMode: 'americano',
      scoringMode: 'tennis', setFormat: 3,
      pointsPerMatch: 32, courts: 2,
      teams: [
        { id:'t1', name:'Team 1', p1:'', p2:'', color: COLORS[0] },
        { id:'t2', name:'Team 2', p1:'', p2:'', color: COLORS[1] },
        { id:'t3', name:'Team 3', p1:'', p2:'', color: COLORS[2] },
        { id:'t4', name:'Team 4', p1:'', p2:'', color: COLORS[3] },
      ],
      schedule: [], currentRound: 0, status: 'setup',
    };
  }
  go('setup');
}

function resume()         { go(S.status === 'finished' ? 'final' : 'play'); }
function confirmDiscard() { if (confirm('Discard the current session?')) { wipe(); go('home'); } }

// ── SETUP ─────────────────────────────────────────────────────────────────────
function setupHTML() {
  if (S.gameMode === 'mexicano') return mexicanoSetupHTML();
  if (S.gameMode === 'team-mexicano') return teamMexicanoSetupHTML();
  return americanoSetupHTML();
}
function americanoSetupHTML() {
  const { n, rounds, matchesPerRound, totalMatches } = scheduleInfo();
  const tennis = S.scoringMode === 'tennis';

  return `
    <div style="margin-bottom:20px;">
      <div class="h2">Setup Session</div>
      <div class="dim" style="margin-top:4px;">Configure teams, scoring format, and courts.</div>
    </div>

    <!-- Scoring mode -->
    <div class="card" style="margin-bottom:10px;">
      <div class="lbl" style="margin-bottom:10px;">Scoring format</div>
      <div class="tg" id="mode-tg">
        <button class="tg-btn ${S.scoringMode==='tennis'?'on-blue':''}" onclick="setMode('tennis')">🎾 Tennis</button>
        <button class="tg-btn ${S.scoringMode==='points'?'on':''}" onclick="setMode('points')">📍 Points</button>
        <button class="tg-btn ${S.scoringMode==='firstto'?'on-green':''}" onclick="setMode('firstto')">🏅 First to</button>
      </div>
      <div id="scoring-sub" style="margin-top:14px;">
        ${scoringSubHTML(S.scoringMode)}
      </div>
    </div>

    <!-- Courts -->
    <div class="card" style="margin-bottom:10px;">
      <div class="lbl" style="margin-bottom:10px;">Number of courts</div>
      <div class="tg" id="courts-tg">
        ${[1,2,3,4].map(c => `<button class="tg-btn ${S.courts===c?'on':''}" onclick="setCourts(${c})">${c} court${c>1?'s':''}</button>`).join('')}
      </div>
    </div>

    <!-- Teams -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div class="lbl">Teams <span id="tc" style="color:var(--gold);margin-left:4px;">${S.teams.length}</span></div>
      <button class="btn btn-outline btn-sm" onclick="addTeam()">+ Add Team</button>
    </div>
    <div id="teams-list">${S.teams.map(teamCardHTML).join('')}</div>

    <!-- Session summary -->
    <div style="margin:16px 0 8px;">
      <div class="lbl" style="margin-bottom:8px;">Session summary</div>
      <div class="info-box" id="info-box">${infoBoxHTML(n, rounds, matchesPerRound, totalMatches)}</div>

// ── Schedule generation ────────────────────────────────────────────────────────
// Uses circle algorithm to generate balanced pairs, then repacks into rounds
// of exactly `courts` simultaneous matches so every round fills all courts.
function buildSchedule() {
  const ids = S.teams.map(t => t.id);
  const eff  = ids.length % 2 === 0 ? ids.length : ids.length + 1;
  const padded = ids.length % 2 !== 0 ? [...ids, 'bye'] : [...ids];
  const fix  = padded[0];
  let rot    = padded.slice(1);

  // Step 1: generate all pairs in round-robin order (7 rounds × 4 pairs for 8 teams)
  const allPairs = [];
  for (let r = 0; r < eff - 1; r++) {
    const list = [fix, ...rot];
    for (let i = 0; i < eff / 2; i++) {
      const a = list[i], b = list[eff - 1 - i];
      if (a !== 'bye' && b !== 'bye') allPairs.push([a, b]);
    }
    rot = [rot[rot.length - 1], ...rot.slice(0, -1)];
  }

  // Step 2: greedily pack pairs into rounds of `courts` with no team appearing twice
  const remaining = [...allPairs];
  const rounds    = [];
  let mid         = 0;

  while (remaining.length > 0) {
    const round      = [];
    const teamsUsed  = new Set();
    const toRemove   = [];

    for (let i = 0; i < remaining.length && round.length < S.courts; i++) {
      const [a, b] = remaining[i];
      if (!teamsUsed.has(a) && !teamsUsed.has(b)) {
        round.push({
          id: `m${mid++}`, court: round.length + 1,
          teamA: a, teamB: b,
          scoreA: null, scoreB: null, setsA: null, setsB: null, done: false,
        });
        teamsUsed.add(a); teamsUsed.add(b);
        toRemove.push(i);
      }
    }

    for (let i = toRemove.length - 1; i >= 0; i--) remaining.splice(toRemove[i], 1);
    rounds.push(round);
  }

  return rounds;
}

function startTeamMexicanoSession() {
  const minTeams = S.courts === 1 ? 2 : 4;
  if (S.teams.length < minTeams) { toast('Need at least '+minTeams+' teams'); return; }
  S.teams.forEach(function(t){ if (t.byeCount === undefined) t.byeCount = 0; });
  const order = S.teams.map(function(t){ return t.id; });
  S.schedule = [buildTeamMexicanoRound(0, shuffleIds(order))];
  S.currentRound = 0; S.status = 'playing';
  persist(); go('play');
}

function buildTeamMexicanoRound(roundIdx, teamOrder) {
  const n = teamOrder.length;
  const matchesPerRound = Math.min(S.courts, Math.floor(n / 2));
  const numPlaying = matchesPerRound * 2;
  const numByes = n - numPlaying;

  var byeTeamIds = [];
  if (numByes > 0) {
    const ranked = teamOrder.slice().sort(function(a, b) {
      const ta = S.teams.find(function(t){ return t.id === a; });
      const tb = S.teams.find(function(t){ return t.id === b; });
      const ba = ta ? (ta.byeCount||0) : 0;
      const bb = tb ? (tb.byeCount||0) : 0;
      if (ba !== bb) return ba - bb;
      return teamOrder.indexOf(b) - teamOrder.indexOf(a);
    });
    byeTeamIds = ranked.slice(0, numByes);
    byeTeamIds.forEach(function(id) {
      const t = S.teams.find(function(t){ return t.id === id; });
      if (t) t.byeCount = (t.byeCount||0) + 1;
    });
  }

  const playing = teamOrder.filter(function(id){ return byeTeamIds.indexOf(id) === -1; });
  const matches = [];
  for (var i = 0; i < matchesPerRound; i++) {
    matches.push({
      id: 'tmx_r'+roundIdx+'_'+i, court: i+1,
      teamA: playing[i*2], teamB: playing[i*2+1],
      scoreA: null, scoreB: null, setsA: null, setsB: null, done: false,
    });
  }
  matches.byeTeams = byeTeamIds;
  return matches;
}

function teamMexicanoNextRound() {
  if (!S.schedule[S.currentRound].every(function(m){ return m.done; })) {
    toast('Complete all matches first'); return;
  }
  const st = standings();
  const order = st.map(function(s){ return s.id; });
  const next = buildTeamMexicanoRound(S.schedule.length, order);
  S.schedule.push(next);
  S.currentRound = S.schedule.length - 1;
  persist(); go('play');
}

  const courts = Math.min(S.courts, Math.floor(n/4));
  const ib = document.getElementById('mex-info');
  const note = document.getElementById('mex-note');
  const pc = document.getElementById('pc');
  if (pc) pc.textContent = n;
  if (ib) ib.innerHTML = `
    <div class="info-cell"><div class="info-val">${n}</div><div class="info-key">Players</div></div>
    <div class="info-cell"><div class="info-val">${courts}</div><div class="info-key">Courts</div></div>
    <div class="info-cell"><div class="info-val">${S.numRounds}</div><div class="info-key">Rounds</div></div>
    <div class="info-cell"><div class="info-val">${S.numRounds*courts}</div><div class="info-key">Total Matches</div></div>`;
  if (note) note.textContent = n < 4
    ? '⚠ Need at least 4 players'
    : n%4!==0
      ? Math.floor(n/4)+' match'+(Math.floor(n/4)>1?'es':'')+' per round · '+(n%4)+' player'+(n%4>1?'s':'')+' sit out each round'
      : Math.floor(n/4)+' match'+(Math.floor(n/4)>1?'es':'')+' per round · pairings change every round';
}

function startMexicanoSession() {
  if (S.players.length < 4) { toast('Need at least 4 players'); return; }
  S.players.forEach(p => { if (p.byeCount === undefined) p.byeCount = 0; });
  const firstRound = buildMexicanoRound(0, shuffleIds(S.players.map(p=>p.id)));
  S.schedule = [firstRound];
  S.currentRound = 0; S.status = 'playing';
  persist(); go('play');
}

function shuffleIds(ids) {
  const a = [...ids];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildMexicanoRound(roundIdx, playerOrder) {
  const n = playerOrder.length;
  const courts = Math.min(S.courts, Math.floor(n / 4));
  const numPlaying = courts * 4;
  const numByes = n - numPlaying;

  // Select who sits out: fewest prior byes first; ties broken by worst rank (end of playerOrder)
  var byePlayerIds = [];
  if (numByes > 0) {
    const ranked = playerOrder.slice().sort(function(a, b) {
      const pa = S.players.find(function(p){return p.id===a;});
      const pb = S.players.find(function(p){return p.id===b;});
      const ba = pa ? (pa.byeCount||0) : 0;
      const bb = pb ? (pb.byeCount||0) : 0;
      if (ba !== bb) return ba - bb; // fewest byes sits out first
      return playerOrder.indexOf(b) - playerOrder.indexOf(a); // worse ranked sits out
    });
    byePlayerIds = ranked.slice(0, numByes);
    byePlayerIds.forEach(function(id) {
      const p = S.players.find(function(p){return p.id===id;});
      if (p) p.byeCount = (p.byeCount||0) + 1;
    });
  }

  const playing = playerOrder.filter(function(id){ return byePlayerIds.indexOf(id) === -1; });
  const matches = [];
  for (let i = 0; i < courts; i++) {
    const base = i * 4;
    matches.push({
      id: `mx_r${roundIdx}_${i}`, court: i+1,
      playerA1: playing[base],   playerA2: playing[base+1],
      playerB1: playing[base+2], playerB2: playing[base+3],
      scoreA: null, scoreB: null, setsA: null, setsB: null, done: false,
    });
  }
  matches.byePlayers = byePlayerIds;
  return matches;
}

function mexicanoNextRound() {
  if (!S.schedule[S.currentRound].every(m=>m.done)) { toast('Complete all matches first'); return; }
  if (S.schedule.length >= S.numRounds) { S.status='finished'; persist(); go('final'); return; }
  const st = mexicanoStandings();
  const order = st.map(s=>s.id);
  const next = buildMexicanoRound(S.schedule.length, order);
  S.schedule.push(next);
  S.currentRound = S.schedule.length - 1;
  persist(); go('play');
}

function mexPlayer(id) {
  return (S.players||[]).find(p=>p.id===id) || { id, name:'?', color:'#888' };
}

function mexicanoTeamBlock(p1id, p2id, align) {
  const p1 = mexPlayer(p1id), p2 = mexPlayer(p2id);
  const right = align === 'right';
  return `
    <div style="text-align:${align};min-width:0;">
      <div style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">

      </div>

        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${p2.color};margin-right:5px;vertical-align:middle;flex-shrink:0;"></span>${p2.name}

function mexicanoMatchCardHTML(m) {
  const p1 = mexPlayer(m.playerA1), p2 = mexPlayer(m.playerA2);
  const p3 = mexPlayer(m.playerB1), p4 = mexPlayer(m.playerB2);
  const labelA = p1.name + ' & ' + p2.name;
  const labelB = p3.name + ' & ' + p4.name;
  return liveScoreCardHTML(m, labelA, '', p1.color, labelB, '', p3.color);
}

function mexicanoStandings() {
  const map = {};
  (S.players||[]).forEach(p => { map[p.id] = { id:p.id, pts:0, sw:0, sl:0, w:0, l:0, played:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    const tennis = S.scoringMode === 'tennis';
    const sA = tennis ? m.setsA : m.scoreA;
    const sB = tennis ? m.setsB : m.scoreB;
    const winA = sA > sB;
    [m.playerA1, m.playerA2].forEach(pid => {
      if (!map[pid]) return;
      if (tennis) { map[pid].sw += sA; map[pid].sl += sB; }
      else { map[pid].pts += sA; }
      map[pid].played++;
      if (winA) map[pid].w++; else map[pid].l++;
    });
    [m.playerB1, m.playerB2].forEach(pid => {
      if (!map[pid]) return;
      if (tennis) { map[pid].sw += sB; map[pid].sl += sA; }
      else { map[pid].pts += sB; }
      map[pid].played++;
      if (!winA) map[pid].w++; else map[pid].l++;
    });
  }));
  return Object.values(map).sort((a,b) =>
    S.scoringMode==='tennis'
      ? (b.sw-b.sl)-(a.sw-a.sl) || b.sw-a.sw || b.w-a.w
      : b.pts-a.pts || b.w-a.w
  );
}

// ── Universal live scoreboard card ───────────────────────────────────────────
function liveScoreCardHTML(m, labelA, subtA, colorA, labelB, subtB, colorB) {

  const sA = tennis ? (m.setsA  || 0) : (m.scoreA || 0);
  const sB = tennis ? (m.setsB  || 0) : (m.scoreB || 0);
  const aWins = sA > sB, bWins = sB > sA;

  // ── Done state ──
  if (m.done) {
    return `
      <div class="card" id="card-${m.id}" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px;">
          ${courtBadge(m)}
          <span style="font-size:11px;color:var(--green);font-weight:700;">✓ Done</span>
          <button onclick="editMatch('${m.id}')"
            style="margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;
                   padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;
                   touch-action:manipulation;">✎ Edit</button>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
          <div class="live-score-col" style="opacity:${aWins?1:0.45};">

// ── Score adjustment (▲▼ buttons) ─────────────────────────────────────────────
function adj(id, side, delta) {
  var m = findMatch(id); if (!m) return;
  var mode = S.scoringMode;

  if (mode === 'firstto') {
    var key = side === 'A' ? 'scoreA' : 'scoreB';
    var target = S.firstToTarget || 4;
    m[key] = Math.max(0, (m[key] || 0) + delta);
    if ((m.scoreA || 0) >= target || (m.scoreB || 0) >= target) {
      m.done = true; persist(); reRenderCard(id);
    } else {
      persist(); updateScoreDOM(id, m);
    }
    return;
  }

  var tennis   = mode === 'tennis';
  var key      = side === 'A' ? (tennis ? 'setsA'  : 'scoreA') : (tennis ? 'setsB'  : 'scoreB');
  var otherKey = side === 'A' ? (tennis ? 'setsB'  : 'scoreB') : (tennis ? 'setsA'  : 'scoreA');
  var target   = tennis ? (S.setFormat || 3) : (S.pointsPerMatch || 32);
  var max      = target - (m[otherKey] || 0);

  m[key] = Math.max(0, Math.min(max, (m[key] || 0) + delta));

  var total = (m[tennis?'setsA':'scoreA']||0) + (m[tennis?'setsB':'scoreB']||0);
  if (total === target) {
    m.done = true; persist(); reRenderCard(id);
  } else {
    persist(); updateScoreDOM(id, m);
  }
}

function updateScoreDOM(id, m) {
  const tennis = S.scoringMode === 'tennis';
  const sA = tennis ? (m.setsA||0) : (m.scoreA||0);
  const sB = tennis ? (m.setsB||0) : (m.scoreB||0);
  const aWins = sA > sB, bWins = sB > sA;

  let colorA, colorB;
  if (S.gameMode === 'mexicano') {
    colorA = mexPlayer(m.playerA1).color; colorB = mexPlayer(m.playerB1).color;
  } else {
    colorA = team(m.teamA).color; colorB = team(m.teamB).color;
  }

  const elA = document.getElementById('sa-'+id);
  const elB = document.getElementById('sb-'+id);
  if (elA) { elA.textContent = sA; elA.style.color = aWins?colorA:bWins?'var(--muted)':'var(--text)'; }
  if (elB) { elB.textContent = sB; elB.style.color = bWins?colorB:aWins?'var(--muted)':'var(--text)'; }

  var firstto = S.scoringMode === 'firstto';
  var target  = tennis ? (S.setFormat||3) : firstto ? (S.firstToTarget||4) : (S.pointsPerMatch||32);
  var pct     = firstto ? Math.round((Math.max(sA,sB)/target)*100) : Math.round(((sA+sB)/target)*100);
  var done    = firstto ? (sA>=target||sB>=target) : sA+sB===target;
  var pEl     = document.getElementById('prog-'+id);
  var tEl     = document.getElementById('prog-txt-'+id);
  if (pEl) { pEl.style.width = pct+'%'; pEl.style.background = done ? 'var(--green)' : firstto ? 'var(--green)' : 'var(--gold)'; }
  if (tEl) { tEl.textContent = (sA+sB)+' / '+target; tEl.style.color = done ? 'var(--green)' : 'var(--text)'; }
  if (!firstto && !done && sA+sB>0 && !document.getElementById('confirm-'+id)) reRenderCard(id);
}

function reRenderCard(id) {
  const el = document.getElementById('card-'+id);
  if (!el) { go('play'); return; }
  const m = findMatch(id); if (!m) return;
  el.outerHTML = matchCardHTML(m);
}

function confirmScore(id) {
  const m = findMatch(id); if (!m) return;
  const tennis = S.scoringMode === 'tennis';
  const sA = tennis ? (m.setsA||0) : (m.scoreA||0);
  const sB = tennis ? (m.setsB||0) : (m.scoreB||0);
  if (sA+sB === 0) { toast('Enter a score first'); return; }
  m.done = true; persist(); reRenderCard(id);
}

function editMatch(id) {
  const m = findMatch(id); if (!m) return;
  m.scoreA = null; m.scoreB = null; m.setsA = null; m.setsB = null; m.done = false;
  persist(); go('play');
}

  const template = S.schedule[cycleIdx];
  const ts = Date.now();
  const newRound = template.map(function(m, i) {

      id: 'xr_' + ts + '_' + i, court: m.court,

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawShareCard(canvas) {
  var W = 520, PAD = 32;
  var isMex = S.gameMode === 'mexicano';
  var tennis = S.scoringMode === 'tennis';
  var medals = ['🥇','🥈','🥉'];
  var SF = '-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

  var entries = [];
  if (isMex) {
    mexicanoStandings().forEach(function(s) {
      var p = mexPlayer(s.id);
      entries.push({ name: p.name, sub: tennis ? s.w+'W · '+s.sw+' sets' : s.pts+' pts', color: p.color });
    });
  } else {
    standings().forEach(function(s) {
      var t = team(s.id);
      entries.push({ name: t.name, players: pname(t), sub: tennis ? s.mw+'W · '+s.sw+' sets' : s.pts+' pts', color: t.color });
    });
  }

  var maxRows = Math.min(entries.length, 6);
  var hasPlayers = entries[0] && entries[0].players;
  var rowH = hasPlayers ? 46 : 40;
  var H = 315 + maxRows * rowH + 48;

  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,W,H);

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(245,200,66,0.035)'; ctx.lineWidth = 1;
  for (var gy=0; gy<H; gy+=44) { ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }
  for (var gx=0; gx<W; gx+=44) { ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }

  // Gold top bar
  var gbar = ctx.createLinearGradient(0,0,W,0);
  gbar.addColorStop(0,'#f5c842'); gbar.addColorStop(0.5,'#ffe880'); gbar.addColorStop(1,'#f5c842');
  ctx.fillStyle = gbar; ctx.fillRect(0,0,W,5);

  var cy = 38;

  // Header label
  ctx.fillStyle = '#f5c842'; ctx.font = '700 10px '+SF; ctx.textAlign = 'center';
  ctx.fillText('C H A M P I O N S   P A D E L', W/2, cy); cy += 26;

  // Session name
  var sessionName = S.sessionName || 'Match Results';
  ctx.fillStyle = '#efefef'; ctx.font = '700 17px '+SF;
  ctx.fillText(sessionName, W/2, cy); cy += 20;

  // Date + mode
  var dateStr = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  var modeStr = isMex ? 'Mexicano' : 'Americano';
  ctx.fillStyle = '#6b7280'; ctx.font = '400 11px '+SF;
  ctx.fillText(dateStr + ' · ' + modeStr, W/2, cy); cy += 22;

  // Gold separator
  ctx.strokeStyle = 'rgba(245,200,66,0.2)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60,cy); ctx.lineTo(W-60,cy); ctx.stroke(); cy += 30;

  // Trophy
  ctx.font = '50px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('🏆', W/2, cy+36); cy += 56;

  // Winner
  var winner = entries[0] || { name:'—', sub:'' };
  ctx.fillStyle = '#f5c842'; ctx.font = '800 22px '+SF;
  ctx.fillText(winner.name, W/2, cy); cy += 20;
  if (winner.players) {
    ctx.fillStyle = '#9ca3af'; ctx.font = '400 11px '+SF;
    ctx.fillText(winner.players, W/2, cy); cy += 18;
  }
  ctx.fillStyle = '#d1d5db'; ctx.font = '600 13px '+SF;
  ctx.fillText(winner.sub, W/2, cy); cy += 26;

  // Thin separator
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD,cy); ctx.lineTo(W-PAD,cy); ctx.stroke(); cy += 16;

  // Standings label
  ctx.fillStyle = '#6b7280'; ctx.font = '700 9px '+SF; ctx.textAlign = 'center';
  ctx.fillText('F I N A L   S T A N D I N G S', W/2, cy); cy += 18;

  // Rows
  for (var i=0; i<maxRows; i++) {
    var e = entries[i];
    var ry = cy + i*rowH;
    if (i === 0) {
      ctx.fillStyle = 'rgba(245,200,66,0.07)';
      rrect(ctx, PAD, ry-12, W-PAD*2, rowH-4, 8); ctx.fill();
    }
    ctx.font = '15px system-ui'; ctx.textAlign = 'left';
    ctx.fillText(medals[i]||(i+1)+'.', PAD+6, ry+5);
    ctx.fillStyle = i===0 ? '#f5c842' : '#efefef';
    ctx.font = (i===0?'800':'600')+' '+(i===0?15:14)+'px '+SF;
    ctx.fillText(e.name, PAD+36, ry+5);
    if (e.players) {
      ctx.fillStyle = '#6b7280'; ctx.font = '400 10px '+SF;
      ctx.fillText(e.players, PAD+36, ry+19);
    }
    ctx.textAlign = 'right';
    ctx.fillStyle = i===0 ? '#f5c842' : '#9ca3af';
    ctx.font = (i===0?'700':'400')+' 13px '+SF;
    ctx.fillText(e.sub, W-PAD, ry+5);
  }

  // Footer bar
  ctx.fillStyle = 'rgba(245,200,66,0.1)'; ctx.fillRect(0,H-36,W,36);
  ctx.strokeStyle = 'rgba(245,200,66,0.18)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H-36); ctx.lineTo(W,H-36); ctx.stroke();
  ctx.fillStyle = '#f5c842'; ctx.font = '600 10px '+SF; ctx.textAlign = 'center';
  ctx.fillText('champions-padel.github.io', W/2, H-13);
}

function doShare() {
  var canvas = document.getElementById('share-canvas');
  canvas.toBlob(function(blob) {
    var slug = (S.sessionName||'results').replace(/[^a-z0-9]/gi,'-').toLowerCase();
    var file = new File([blob], slug+'-champions.png', {type:'image/png'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:'Champions Padel Results', text:shareText()}).catch(function(){});
    } else {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href=url; a.download=slug+'-champions.png';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }
  });
}

function copyShareText() {
  var text = shareText();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { toast('Copied to clipboard!'); });
  } else {
    var ta = document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('Copied!');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function team(id)    { return S.teams.find(t => t.id === id) || { name:'?', p1:'', p2:'', color:'#888' }; }
function pname(t)    { return (t.p1||'Player 1') + ' & ' + (t.p2||'Player 2'); }
function esc(s)      { return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function findMatch(id) {
  for (const r of S.schedule) { const m = r.find(m => m.id === id); if (m) return m; }
  return null;
}

function standings() {
  if (S.scoringMode === 'tennis') return tennisStandings();
  if (S.scoringMode === 'firstto') return applySort(firstToStandings());
  return applySort(pointsStandings());
}

function applySort(arr) {
  var by = S.standingsSort || 'wins';
  return arr.slice().sort(function(a, b) {
    return by === 'pts'
      ? (b.pts||0)-(a.pts||0) || (b.w||0)-(a.w||0)
      : (b.w||0)-(a.w||0)   || (b.pts||0)-(a.pts||0);
  });
}

function setSortBy(key) {
  S.standingsSort = key;
  persist();
  go(S.status === 'finished' ? 'final' : 'play');
}

function firstToStandings() {
  const map = {};
  S.teams.forEach(t => { map[t.id] = { id:t.id, w:0, l:0, pts:0, ag:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    map[m.teamA].pts += m.scoreA; map[m.teamA].ag += m.scoreB;
    map[m.teamB].pts += m.scoreB; map[m.teamB].ag += m.scoreA;
    if (m.scoreA > m.scoreB) { map[m.teamA].w++; map[m.teamB].l++; }
    else                     { map[m.teamB].w++; map[m.teamA].l++; }
  }));
  return Object.values(map).sort((a,b) => b.w-a.w || (b.pts-b.ag)-(a.pts-a.ag));
}

function pointsStandings() {
  const map = {};
  S.teams.forEach(t => { map[t.id] = { id:t.id, pts:0, ag:0, w:0, l:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    map[m.teamA].pts += m.scoreA; map[m.teamA].ag += m.scoreB;
    map[m.teamB].pts += m.scoreB; map[m.teamB].ag += m.scoreA;
    if (m.scoreA > m.scoreB) { map[m.teamA].w++; map[m.teamB].l++; }
    else                     { map[m.teamB].w++; map[m.teamA].l++; }
  }));
  return Object.values(map).sort((a,b) => b.pts-a.pts || b.w-a.w || (b.pts-b.ag)-(a.pts-a.ag));
}

function tennisStandings() {
  const map = {};
  S.teams.forEach(t => { map[t.id] = { id:t.id, mw:0, ml:0, sw:0, sl:0 }; });
  S.schedule.forEach(r => r.forEach(m => {
    if (!m.done) return;
    const sA = m.setsA, sB = m.setsB;
    map[m.teamA].sw += sA; map[m.teamA].sl += sB;
    map[m.teamB].sw += sB; map[m.teamB].sl += sA;
    if (sA > sB) { map[m.teamA].mw++; map[m.teamB].ml++; }
    else         { map[m.teamB].mw++; map[m.teamA].ml++; }
  }));
  return Object.values(map).sort((a,b) => b.mw-a.mw || b.sw-a.sw || (b.sw-b.sl)-(a.sw-a.sl));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Sheets: save & history ────────────────────────────────────────────────────
function saveSession(nameOverride) {
  if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_APPS')) { toast('Set SCRIPT_URL in code first'); return; }
  var st = S.gameMode === 'mexicano' ? mexicanoStandings() : standings();
  var payload = {
    sessionName:    nameOverride || S.sessionName || '',
    gameMode:       S.gameMode,
    scoringMode:    S.scoringMode,
    setFormat:      S.setFormat,
    pointsPerMatch: S.pointsPerMatch,
    courts:         S.courts,
    teams:          S.teams   || [],
    players:        S.players || [],
    standings:      st,
    schedule:       S.schedule
  };
  var format = S.scoringMode === 'tennis'
    ? 'Bo' + (S.setFormat || 3)
    : (S.pointsPerMatch || 32) + ' pts';
  var winner = st.length > 0
    ? (S.gameMode === 'mexicano' ? mexPlayer(st[0].id).name : team(st[0].id).name)
    : '';
  var params = new URLSearchParams({
    action:    'save',
    name:      payload.sessionName || '',
    mode:      payload.gameMode,
    scoring:   payload.scoringMode,
    format:    format,
    courts:    payload.courts || 1,
    rounds:    (payload.schedule || []).length,
    winner:    winner,
    standings: JSON.stringify(st.slice(0, 12))
  });
  toast('Saving…');
  fetch(SCRIPT_URL + '?' + params.toString())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) { toast('✓ Session saved!'); S.saved = true; persist(); }
      else { toast('Error: ' + (data.error || 'unknown')); }
    })
    .catch(function() { toast('Save failed — check connection'); });
}

function promptSaveSession() {
  const name = prompt('Name this session (e.g. "Week 3 – Mexicano"):', S.sessionName || '');
  if (name === null) return;
  S.sessionName = name.trim();
  persist();
  saveSession(S.sessionName);
}

function loadHistory() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('YOUR_APPS')) { toast('Set SCRIPT_URL in code first'); return; }
  go('history');
  fetch(SCRIPT_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) { renderHistory(data.sessions || []); })
    .catch(function() { renderHistory(null); });
}

function renderHistory(sessions) {
  const el = document.getElementById('history-list');
  if (!el) return;
  if (!sessions) { el.innerHTML = `<div class="dim" style="padding:20px 0;">Failed to load. Check your connection.</div>`; return; }
  if (!sessions.length) { el.innerHTML = `<div class="dim" style="padding:20px 0;">No saved sessions yet.</div>`; return; }
  el.innerHTML = sessions.map(s => {
    const date = s.timestamp ? new Date(s.timestamp).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
    const time = s.timestamp ? new Date(s.timestamp).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
    const mode = s.gameMode === 'mexicano' ? '🔥 Mexicano' : '🎾 Americano';
    const top3 = (s.standings||[]).slice(0,3);
    const medals = ['🥇','🥈','🥉'];
    const nameList = top3.map((p,i) => {
      const ent = (s.teams||[]).find(t=>t.id===p.id) || (s.standings||[]).find(t=>t.id===p.id);
      return `${medals[i]} ${ent ? (ent.name||p.id) : p.id}`;
    }).join(' · ');
    return `
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <div>
            <div style="font-weight:700;font-size:14px;">${esc(s.sessionName || 'Unnamed session')}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">${date} · ${time}</div>
          </div>
          <div style="font-size:12px;color:var(--muted);">${mode}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">${s.format||''} · ${s.courts||''} court${s.courts!==1?'s':''} · ${s.rounds||''} rounds</div>
        ${nameList ? `<div style="font-size:12px;font-weight:600;">${nameList}</div>` : ''}
      </div>`;
  }).join('');
}

function historyHTML() {
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <button class="btn btn-outline" onclick="go('home')" style="padding:8px 14px;font-size:13px;">← Back</button>
      <div class="h2">Past Sessions</div>
    </div>
    <div id="history-list">
      <div class="dim" style="padding:20px 0;text-align:center;">Loading…</div>
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
load();
go('home');
</script>
